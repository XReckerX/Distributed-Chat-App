<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ "Login" if mode == "login" else "Register" }} · Distributed Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">DC</div>
    <h1>Distributed Chat</h1>
    <p class="muted">{{ "Sign in to continue" if mode == "login" else "Create your account" }}</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label>Username</label>
      <input name="username" required minlength="3" maxlength="20" autocomplete="username">

      <label>Password</label>
      <input type="password" name="password" required minlength="4" autocomplete="{{ 'current-password' if mode == 'login' else 'new-password' }}">

      <button class="primary" type="submit">{{ "Login" if mode == "login" else "Register" }}</button>
    </form>

    {% if mode == "login" %}
      <p class="switch">No account? <a href="{{ url_for('register') }}">Register</a></p>
    {% else %}
      <p class="switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    {% endif %}
  </main>
</body>
</html>
